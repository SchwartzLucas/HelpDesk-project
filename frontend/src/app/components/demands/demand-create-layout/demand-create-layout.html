<main>
    <div class="modal-overlay" (click)="fecharJanelaCriar()">
      <div class="modal-window" (click)="$event.stopPropagation()">
        <div class="modal-header">
          <h2>Nova demanda</h2>
          <button
            type="button"
            class="btn-fechar"
            (click)="fecharJanelaCriar()">
            ×
          </button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label for="title">
              Título
            </label>
            <input
              id="title"
              type="text"
              [(ngModel)]="newDemand.title"
              placeholder="Digite o título da demanda">
          </div>
          <div class="form-group">
            <label for="description">
              Descrição
            </label>

            <textarea
              id="description"
              [(ngModel)]="newDemand.description"
              placeholder="Descreva a demanda">
          </textarea>
          </div>
          <div class="form-group">
            <label for="user">
              Usuário responsável
            </label>
            <select
              id="user"
              [(ngModel)]="newDemand.user_id"
              (click)="carregarUsuarios()">
              <option [ngValue]="null">
                Nenhum usuário atribuído
              </option>
              @if (carregandoUsuarios) {
                <option disabled>
                  Carregando usuários...
                </option>
              }
              @for (user of users; track user.user_id) {
                <option [ngValue]="user.user_id">
                  {{ user.user_name }}
                </option>
              }
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn-cancelar"
            (click)="fecharJanelaCriar()">
            Cancelar
          </button>
          <button
            type="button"
            class="btn-criar"
            [disabled]="!newDemand.title.trim()"
            (click)="criarDemanda()">
            Criar demanda
          </button>
        </div>
      </div>
    </div>
</main>
